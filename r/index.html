  <!-- INGRID WEBSITE WIDGET - LIVE v2 (2026-11-04, auto-close change)
     LIVE. Phase 1 live block + Kemar's auto-close rule (10:32 ET):
     auto-open after 10 seconds as before; if the visitor does
     nothing in the auto-opened panel for 5 seconds, it closes
     by itself. Any typing, button tap, or message cancels the
     5-second timer. Manual open stays open (no timer). Manual
     close stays closed (blocks auto-open + exit-intent after).
     Automatic opens (10-second + exit-intent) carry the 5-second
     idle timer; manual opens never do.
     MERGE NOTE: every later merge must carry forward BOTH the
     10,000 ms auto-open delay AND the 5-second auto-close rule.
     Greeting/header/buttons/logo/colors unchanged from v1.
     Static lines verbatim, Claude PASS no fixes: waiting line +
     business-hours line with plain hyphen in Monday-Friday.
     No TEST prefix on live messages. No staging hook.
-->
<style>
  #ingrid-widget-btn{position:fixed;right:20px;bottom:20px;z-index:9998;width:64px;height:64px;border-radius:50%;border:0;background:#10233F;color:#fff;display:flex;align-items:center;justify-content:center;cursor:pointer;box-shadow:0 6px 20px rgba(16,35,63,.35)}
  #ingrid-widget-panel{display:none;position:fixed;right:20px;bottom:96px;z-index:9999;width:320px;max-width:calc(100vw - 40px);background:#fff;border:1px solid #e5e7eb;border-radius:16px;box-shadow:0 12px 32px rgba(16,35,63,.25);font-family:Poppins,sans-serif;color-scheme:light;overflow:hidden}
  #ingrid-widget-panel.open{display:block}
  #ingrid-widget-head{background:#10233F;color:#fff;padding:14px 16px;font-weight:700;font-size:15px}
  #ingrid-widget-head span{display:block;font-weight:400;font-size:12px;opacity:.85;margin-top:2px}
  #ingrid-widget-body{padding:16px}
  #ingrid-widget-body p{margin:0 0 12px;font-size:14px;line-height:1.5;color:#10233F}
  #ingrid-widget-logo{display:block;width:120px;height:auto;margin:0 0 10px}
  #ingrid-widget-body a{display:block;text-align:center;text-decoration:none;border-radius:10px;padding:12px;margin:0 0 10px;font-weight:700;font-size:14px}
  #ingrid-widget-book{background:#FACC15;color:#10233F}
  #ingrid-widget-survey,#ingrid-widget-contact{background:#fff;color:#10233F;border:2px solid #10233F}
  #ingrid-widget-foot{padding:0 16px 12px;font-size:11px;color:#6b7280;text-align:center}
  #ingrid-widget-close{position:absolute;top:8px;right:10px;background:none;border:0;color:#fff;font-size:20px;cursor:pointer}
  #ingrid-widget-messages{max-height:280px;overflow-y:auto;margin-bottom:12px}
  #ingrid-widget-messages p{margin:0 0 10px;font-size:14px;line-height:1.5;color:#10233F}
  #ingrid-widget-messages p.visitor{text-align:right;color:#334155}
  #ingrid-widget-form{display:flex;gap:8px;margin-top:4px}
  #ingrid-widget-input{flex:1;min-width:0;border:2px solid #10233F;border-radius:10px;padding:10px;font-family:Poppins,sans-serif;font-size:14px;color:#10233F}
  #ingrid-widget-send{background:#FACC15;color:#10233F;border:0;border-radius:10px;padding:10px 16px;font-weight:700;font-family:Poppins,sans-serif;font-size:14px;cursor:pointer}
</style>
<button id="ingrid-widget-btn" aria-label="Chat with CSRA Marketing"><svg width="30" height="30" viewBox="0 0 24 24" aria-hidden="true"><rect x="2" y="3" width="20" height="14" rx="7" fill="#FF705C"/><path d="M8 17 5 21l7-3.5z" fill="#FF705C"/></svg></button>
<div id="ingrid-widget-panel" role="dialog" aria-label="CSRA Marketing help">
  <div id="ingrid-widget-head">Hi, I'm Ingrid
    <span>CSRA Marketing's AI assistant</span>
    <button id="ingrid-widget-close" aria-label="Close">×</button>
  </div>
  <div id="ingrid-widget-body">
    <img id="ingrid-widget-logo" src="/assets/csra-logo.png" alt="CSRA Marketing">
    <p id="ingrid-widget-greet">Thanks for visiting CSRA Marketing. What brings you here today?</p>
    <div id="ingrid-widget-messages"></div>
    <a id="ingrid-widget-book" href="/website-audit/">Book a 30-minute audit call</a>
    <a id="ingrid-widget-survey" href="/survey/">Take the 2027 Roofing Marketing Survey</a>
    <a id="ingrid-widget-contact" href="/contact/#contact-form">Send us a message</a>
    <form id="ingrid-widget-form">
      <input id="ingrid-widget-input" type="text" placeholder="Type your message" aria-label="Type your message" autocomplete="off">
      <button id="ingrid-widget-send" type="submit">Send</button>
    </form>
  </div>
  <div id="ingrid-widget-foot">&copy; 2026 CSRA Marketing</div>
</div>
<script>
  (function(){
    var BASE='https://ingrid-chat-carrier.kemar-csramarketing.workers.dev';
    var WAITING_LINE='Thanks. Your message is saved. Replies appear here.';
    var HOURS_LINE='Our team replies during business hours (Monday-Friday, 8 AM-6 PM Eastern).';
    var btn=document.getElementById('ingrid-widget-btn');
    var panel=document.getElementById('ingrid-widget-panel');
    var close=document.getElementById('ingrid-widget-close');
    var greet=document.getElementById('ingrid-widget-greet');
    var autoTimer=setTimeout(function(){openAuto();},10000);
    var closeTimer=null;
    var closedByHand=false;
    function cancelAutoTimer(){if(autoTimer){clearTimeout(autoTimer);autoTimer=null;}}
    function cancelCloseTimer(){if(closeTimer){clearTimeout(closeTimer);closeTimer=null;}}
    function openAuto(){
      if(closedByHand){return;}
      panel.classList.add('open');
      onOpen();
      closeTimer=setTimeout(function(){panel.classList.remove('open');stopPoll();closeTimer=null;},5000);
    }
    btn.addEventListener('click',function(){cancelAutoTimer();cancelCloseTimer();panel.classList.toggle('open');if(panel.classList.contains('open')){closedByHand=false;onOpen();}else{closedByHand=true;stopPoll();}});
    close.addEventListener('click',function(){cancelAutoTimer();cancelCloseTimer();closedByHand=true;panel.classList.remove('open');stopPoll();});
    panel.addEventListener('input',cancelCloseTimer);
    panel.addEventListener('click',cancelCloseTimer);
    var exitFired=false;
    function fireExitIntent(){
      if(exitFired){return;}
      exitFired=true;
      if(closedByHand){return;}
      if(panel.classList.contains('open')){return;}
      if(greet){greet.textContent='Before you go: need anything before you leave?';}
      openAuto();
    }
    document.addEventListener('mouseout',function(e){
      if(!e.relatedTarget && e.clientY<=0){fireExitIntent();}
    });
    if(window.matchMedia && window.matchMedia('(pointer: coarse)').matches){
      var lastY=window.scrollY||0;
      var upRun=0;
      var upStart=0;
      window.addEventListener('scroll',function(){
        var y=window.scrollY||0;
        var now=Date.now();
        var up=lastY-y;
        if(up>0){
          if(now-upStart>500){upRun=0;upStart=now;}
          upRun+=up;
          if(upRun>300){fireExitIntent();}
        } else {
          upRun=0;
          upStart=now;
        }
        lastY=y;
      },{passive:true});
    }
    function isBusinessHours(d){
      try{
        var parts=new Intl.DateTimeFormat('en-US',{timeZone:'America/New_York',weekday:'short',hour:'numeric',hour12:false}).formatToParts(d);
        var wd='',hr=0;
        parts.forEach(function(p){if(p.type==='weekday'){wd=p.value;}if(p.type==='hour'){hr=parseInt(p.value,10);}});
        if(wd==='Sat'||wd==='Sun'){return false;}
        if(hr===24){hr=0;}
        return hr>=8 && hr<18;
      }catch(e){return true;}
    }
    var box=document.getElementById('ingrid-widget-messages');
    var form=document.getElementById('ingrid-widget-form');
    var input=document.getElementById('ingrid-widget-input');
    var sessionId=null;
    try{
      sessionId=window.localStorage.getItem('csra-ingrid-session');
      if(!sessionId){
        sessionId=Date.now() + '-' + Math.floor(Math.random()*1000000);
        window.localStorage.setItem('csra-ingrid-session',sessionId);
      }
    }catch(e){
      sessionId=Date.now() + '-' + Math.floor(Math.random()*1000000);
    }
    var afterId=0;
    var pollTimer=null;
    var hoursShown=false;
    var openedOnce=false;
    function say(text, cls){
      var p=document.createElement('p');
      if(cls){p.className=cls;}
      p.textContent=text;
      box.appendChild(p);
      box.scrollTop=box.scrollHeight;
    }
    function poll(){
      fetch(BASE + '/messages?session_id=' + encodeURIComponent(sessionId) + '&after_id=' + afterId)
        .then(function(r){return r.json();})
        .then(function(d){
          (d.messages||[]).forEach(function(m){
            if(m.id>afterId){afterId=m.id;}
            if(m.sender==='visitor'){say(m.text, 'visitor');}
            else if(m.sender==='Ingrid'){say('Ingrid: ' + m.text);}
            else if(m.sender==='team'){say('Team: ' + m.text);}
          });
        })
        .catch(function(){});
    }
    function startPoll(){
      if(pollTimer){return;}
      poll();
      pollTimer=setInterval(poll,15000);
    }
    function stopPoll(){
      if(pollTimer){clearInterval(pollTimer);pollTimer=null;}
    }
    function onOpen(){
      if(!openedOnce){
        openedOnce=true;
        if(!isBusinessHours(new Date()) && !hoursShown){
          hoursShown=true;
          say(HOURS_LINE);
        }
      }
      startPoll();
    }
    form.addEventListener('submit', function(e){
      e.preventDefault();
      var v=input.value;
      input.value='';
      var text=v.trim();
      if(!text){return;}
      var text=v.trim();
      if(!text){return;}
      var low=text.toLowerCase();
      var isOptOut=(low.indexOf('stop')!==-1 || low.indexOf('unsubscribe')!==-1 || low.indexOf('do not contact')!==-1 || low.indexOf('remove me')!==-1);
      fetch(BASE + '/messages', {
        method:'POST',
        headers:{'Content-Type':'application/json'},
        body: JSON.stringify({session_id: sessionId, sender:'visitor', text: text})
      }).then(function(r){return r.json();}).then(function(d){
        if(d && d.id){
          if(isOptOut){
            say('Got it. I have noted that and will stop here.');
          } else {
            say(WAITING_LINE);
          }
          poll();
        }
      }).catch(function(){});
    });
  })();
</script>
<!-- END INGRID WEBSITE WIDGET -->


</body>
