<p class="eyebrow">Chapter 01</p>
<h2>The short answer: stop renting your leads</h2>
<p>If you're spending more than $1,000 a month on shared leads and plan to be in business two years from now, you're almost certainly better off investing that budget in your own website and SEO.</p>
<p>Here's why in one sentence: every dollar you spend on Angi buys you a lead once, but every dollar you spend on your own site keeps working after you stop paying.</p>
<p>The rest of this post shows you the math so you can check it yourself.</p>

</section>

<section class="chapter" id="ch2">
<p class="eyebrow">Chapter 02</p>
<h2>Why your $75 lead actually costs $750 per booked job</h2>
<p>Let's start with what the invoice says versus what it really costs.</p>
<p>Roofing leads from shared marketplaces typically run $50 to $120 per lead (typical market range; varies by platform and market). Say you're paying $75 a lead and buying 20 a month. That's $1,500 a month, $18,000 a year, $36,000 over two years.</p>
<p>But here's the deal: that $75 lead typically goes to 3 to 5 other roofers at the same time (typical market range). You're not buying a lead. You're buying a lottery ticket.</p>
<p>Shared leads close at roughly 5 to 15% for most roofers (typical market range). At 10%, your 20 leads a month turn into 2 booked jobs. Your $1,500 bought 2 jobs. That's $750 per booked job.</p>
<p>And the day you stop paying? The leads stop the same day. You own nothing.</p>

</section>

<section class="chapter" id="ch3">
<p class="eyebrow">Chapter 03</p>
<h2>The 24-month math, side by side</h2>
<div class="table-wrap"><table>
<p>Now let's put the same $36,000 toward your own website and SEO over 24 months.</p>
<p>A professional roofing website runs $2,000 to $5,000 as a one-time build (typical market range). Say $3,500. That leaves $32,500 for SEO over 24 months, or about $1,350 a month, right in the normal range for a local roofing SEO campaign.</p>
<p>Exclusive leads , where you're the only roofer getting the call, close at a significantly higher rate because there's no race. The 30% used below is illustrative; your own close rate is the number that matters.</p>
<p>Here's what each path looks like:</p>
<tr><th></th><th>Angi (24 months)</th><th>Own website + SEO (24 months)</th></tr>
<tr><td>Total spend</td><td>$36,000</td><td>$36,000</td></tr>
<tr><td>Leads per month (avg)</td><td>20 shared</td><td>0 → 15+ organic, illustrative (grows)</td></tr>
<tr><td>Close rate</td><td>~10% (shared)</td><td>~30% (exclusive, illustrative)</td></tr>
<tr><td>Booked jobs/month</td><td>~2</td><td>0 → 4+ (grows)</td></tr>
<tr><td>What you own at month 24</td><td>Nothing</td><td>A ranking website</td></tr>
</table></div>
<p>The catch? Months 1 through 6 favor Angi. Your site is new, SEO takes time, and the leads aren't flowing yet. You're spending money and waiting.</p>
<p>But here's what the table doesn't show: the curve. Angi's line is flat: $1,500 in, 2 jobs out, every month, forever. Your website's line curves up. Month 12 beats month 6. Month 24 beats month 12. And at month 25, when the Angi buyer is still paying $1,500, your site is still generating leads from money you already spent.</p>
<p>Let me put profit on it. A $12,000 roof at 40% gross margin is $4,800 in profit per job. Two jobs a month from Angi is $9,600 in gross profit against $1,500 in lead spend. That looks fine on paper.</p>
<p>But here's what the table doesn't show yet: at month 18 on your own site, those 4+ jobs a month are $19,200 in gross profit against roughly the same monthly spend. And the spend stops compounding against you the day you own the asset. (Illustrative math: plug in your own ticket size and margin.)</p>
<p>These are illustrative numbers. Swap in your own lead costs and close rates. But the shape of the curve is the point, not the exact figures.</p>

</section>

<section class="chapter" id="ch4">
<p class="eyebrow">Chapter 04</p>
<h2>Why every dollar you spend on SEO is still working at month 25</h2>
<p>Think about it this way: Angi is rent. Your website is a mortgage.</p>
<p>Every month you pay rent, you get a place to sleep that month. Every month you pay a mortgage, you get a place to sleep AND you own a little more of the building.</p>
<p>SEO works the same way. Every article you publish, every review you earn, every local citation you build, it stacks. Month 18's rankings are built on month 6's work. Nobody can take that away from you unless you let the site rot.</p>
<p>Yes, a website needs ongoing SEO the way a house needs maintenance. But at month 24, you still own the asset.</p>
<p>With Angi, month 18 looks exactly like month 1. Same $75 leads. Same 4 competitors calling the homeowner before you. Same $750 per booked job.</p>
<p>The question isn't whether SEO is slower at first. It is. The question is whether you want to be having this same conversation and writing this same check , in 2029.</p>

</section>

<section class="chapter" id="ch5">
<p class="eyebrow">Chapter 05</p>
<h2>What $36,000 buys you: two paths, one decision</h2>
<p>So what does "invest in your own website" mean in practice? Two parts.</p>
<p><strong>Part one: the website.</strong> A professional roofing site: custom design, real copywriting, fast on phones, built to convert visitors into calls, runs $2,000 to $5,000 as a one-time cost (typical market range). This is the foundation. Without it, SEO has nowhere to send traffic.</p>
<p><strong>Part two: monthly SEO.</strong> A real local SEO campaign for a roofing company covers Google Business Profile management, review strategy, local content, authority links, technical maintenance, runs $1,500 to $5,000 a month (typical market range). The range depends on your market's competitiveness.</p>
<p>Add them up over 24 months and you're in the same neighborhood as the Angi spend. The difference is what you have at the end.</p>
<p>One thing I want to be straight about: this only works if the SEO is real. A low-cost "SEO package" that sends you a PDF report every month is not this. That's just a cheaper way to waste money.</p>

</section>

<section class="chapter" id="ch6">
<p class="eyebrow">Chapter 06</p>
<h2>When buying leads still makes sense</h2>
<p>I'll be honest: there are times when Angi is the right call.</p>
<p>If you just started your company and need jobs this month, SEO will not save you. It takes 4 to 8 months as a working guideline before a campaign hits its stride. You can't eat rankings.</p>
<p>If you're in a slow season and need to fill the schedule fast, a short burst of paid leads can bridge the gap while your organic presence builds.</p>
<p>And if you've tried SEO before with a bad provider and got burned, I get the skepticism. Not every campaign works. The provider matters more than the channel.</p>
<p>But "buy leads forever" is not a strategy. It is a subscription to someone else's business model. Use paid leads as a bridge, not a destination.</p>

</section>

<section class="chapter" id="ch7">
<p class="eyebrow">Chapter 07</p>
<h2>How to make the switch</h2>
<p>If the math makes sense, here's how I'd do it.</p>
<p><strong>Step #1: Don't cancel Angi tomorrow.</strong> Keep the leads flowing while you build. The worst move is cutting revenue before the replacement is ready.</p>
<p><strong>Step #2: Get the website built first.</strong> This takes 2 to 4 weeks with a good partner. It's the asset everything else points to.</p>
<p><strong>Step #3: Start SEO while the site is being built.</strong> Good providers can start technical work, keyword research, and content planning before launch. You want momentum on day one, not day thirty.</p>
<p><strong>Step #4: Set a date to cut the cord.</strong> Pick a month, say month 9 or 12, where you will evaluate. If organic is covering the gap, reduce Angi spend. If it's not there yet, extend. But have the date. Open-ended subscriptions are how $36,000 disappears.</p>
<p><strong>Step #5: Track cost per booked job, not cost per lead.</strong> This is the number that matters. If your blended cost per booked job from your own site drops below what Angi was charging you, the switch paid off. Most owners I talk to see this happen between months 9 and 14 (illustrative timeline).</p>
<p>Pro tip: run your own numbers through a lead cost comparison tool before you decide. Plug in what you're actually paying per lead, your actual close rate, and see what the 24-month picture looks like with your numbers instead of mine.</p>

</section>

<summary>How much does Angi charge roofers per lead?</summary>
<div class="a"><p>Roofing leads from shared marketplaces typically run $50 to $120 per lead (typical market range; varies by platform and market). The lead is shared with 3 to 5 other contractors, so your real cost per booked job is much higher than the per-lead price.</p></div>
</details>
<details class="faq-item">
<summary>Is it better to buy roofing leads or invest in SEO?</summary>
<div class="a"><p>Buying leads gives you jobs faster: this month, not next year. SEO gives you a lower cost per job over time and an asset you own. If you need work now, buy leads as a bridge. If you're planning 2+ years out, the math favors investing in your own website and SEO.</p></div>
</details>
<details class="faq-item">
<summary>How long until SEO replaces my paid leads?</summary>
<div class="a"><p>Plan on 4 to 8 months as a working guideline before a campaign hits its stride, and 9 to 14 months before organic fully replaces a paid lead budget (illustrative timeline). It varies by market competitiveness and how aggressive the campaign is.</p></div>
</details>
<details class="faq-item">
<summary>What does a roofing SEO campaign cost per month?</summary>
<div class="a"><p>A real local SEO campaign for a roofing company runs $1,500 to $5,000 a month (typical market range). Below that range you're usually getting automated reports, not actual work. The range depends on how competitive your market is.</p></div>
</details>
<details class="faq-item">
<summary>Can I do SEO myself instead of hiring someone?</summary>
<div class="a"><p>You can handle basics like asking for reviews and keeping your Google Business Profile updated. But technical SEO, content strategy, and authority building take real expertise and consistent hours every month. Most owners who try DIY stall out after 60 days because they're running a roofing company, not a marketing agency.</p></div>
</details>
<details class="faq-item">
<summary>What happens if I stop paying for SEO?</summary>
<div class="a"><p>Unlike Angi, where leads stop the day you cancel. A well-built site keeps ranking for months after you pause SEO. Rankings decay slowly without maintenance, they don't vanish overnight. That's the compounding effect: you keep most of what you built.</p></div>
</details>
<details class="faq-item">
<summary>Should a new roofing company start with Angi or a website?</summary>
<div class="a"><p>Both, in sequence. You need jobs now, so Angi or another lead source fills the gap. But start building the website immediately. Every month you delay is a month of compounding you are not getting. Set a date 9 to 12 months out to evaluate whether organic can take over.</p></div>
</details>
<details class="faq-item">
<summary>How do I know if my SEO provider is actually doing work?</summary>
<div class="a"><p>Ask for three things every month: what was published or built, what changed in rankings and traffic, and what is planned next. If you get a PDF full of charts but cannot point to a single new page, link, or ranking improvement, you are paying for reports, not SEO.</p></div>
</details>
